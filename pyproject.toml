[project]
name = "socratic-whiteboard"
version = "2.0.0"
description = "Protocol-driven Socratic whiteboard tutor (Lumen Learn-style)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "openai>=1.30",
  "json-repair>=0.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
edge = ["edge-tts>=6.1"]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
