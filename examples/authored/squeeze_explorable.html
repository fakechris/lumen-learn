<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; background: #faf8f3; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; color: #333; overflow: hidden; }
    #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
    #plot { flex: 1; min-height: 0; margin: 10px 10px 4px; border: 1px solid #d9d2c3; border-radius: 12px; background: #fbfaf6; cursor: crosshair; touch-action: none; }
    #readout { display: flex; justify-content: center; align-items: center; gap: 28px; padding: 4px 0 8px; font-size: 12px; color: #666; }
    #readout .k { display: block; font-size: 11px; letter-spacing: .04em; }
    #readout .v { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 700; color: #c0392b; min-width: 64px; text-align: center; }
    #formula { display: inline-block; padding: 3px 10px; border: 1px solid #d9d2c3; border-radius: 6px; background: #fff; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 13px; color: #333; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="plot"></canvas>
    <div id="readout">
      <span><span class="k">当前 X</span><span class="v" id="rx">—</span></span>
      <span><span class="k">F(X)</span><span class="v" id="ry">—</span></span>
      <span id="formula">f(x) = x² · sin(1/x)</span>
    </div>
  </div>
  <script>
    // --- the thing being explored -------------------------------------
    const f = (x) => (x === 0 ? 0 : x * x * Math.sin(1 / x));
    const upper = (x) => x * x, lower = (x) => -x * x;
    const X_MIN = -0.32, X_MAX = 0.32, Y_MIN = -0.075, Y_MAX = 0.075;

    // --- plumbing ------------------------------------------------------
    const canvas = document.getElementById("plot");
    const ctx = canvas.getContext("2d");
    let W = 0, H = 0, probeX = null;
    const PAD = { l: 34, r: 18, t: 18, b: 26 };
    const sx = (x) => PAD.l + (x - X_MIN) / (X_MAX - X_MIN) * (W - PAD.l - PAD.r);
    const sy = (y) => PAD.t + (Y_MAX - y) / (Y_MAX - Y_MIN) * (H - PAD.t - PAD.b);
    const ux = (px) => X_MIN + (px - PAD.l) / (W - PAD.l - PAD.r) * (X_MAX - X_MIN);

    function resize() {
      const r = canvas.getBoundingClientRect();
      W = r.width; H = r.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function curve(fn, style) {
      ctx.save(); Object.assign(ctx, style.props || {});
      if (style.dash) ctx.setLineDash(style.dash);
      ctx.beginPath();
      const n = 1600; let started = false;
      for (let i = 0; i <= n; i++) {
        const x = X_MIN + (X_MAX - X_MIN) * i / n, y = fn(x);
        if (!isFinite(y)) { started = false; continue; }
        const px = sx(x), py = sy(Math.max(Y_MIN * 1.3, Math.min(Y_MAX * 1.3, y)));
        started ? ctx.lineTo(px, py) : ctx.moveTo(px, py); started = true;
      }
      ctx.stroke(); ctx.restore();
    }

    function label(text, x, y, color, align = "left") {
      ctx.save(); ctx.font = "italic 12px Georgia, serif"; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(text, x, y); ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // axes
      ctx.save(); ctx.strokeStyle = "#b9b3a6"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PAD.l, sy(0)); ctx.lineTo(W - PAD.r, sy(0)); ctx.moveTo(sx(0), PAD.t); ctx.lineTo(sx(0), H - PAD.b); ctx.stroke();
      ctx.fillStyle = "#8a8377"; ctx.font = "italic 11px Georgia, serif"; ctx.textAlign = "center";
      for (const x of [-0.2, 0.2]) { ctx.beginPath(); ctx.moveTo(sx(x), sy(0) - 3); ctx.lineTo(sx(x), sy(0) + 3); ctx.stroke(); ctx.fillText(x, sx(x), sy(0) + 14); }
      ctx.textAlign = "right";
      for (const y of [-0.04, 0.04]) { ctx.beginPath(); ctx.moveTo(sx(0) - 3, sy(y)); ctx.lineTo(sx(0) + 3, sy(y)); ctx.stroke(); ctx.fillText(y, sx(0) - 6, sy(y) + 4); }
      ctx.fillText("x", W - PAD.r - 2, sy(0) - 6); ctx.textAlign = "left"; ctx.fillText("y", sx(0) + 6, PAD.t + 8);
      ctx.restore();
      // envelopes (the "bread")
      curve(upper, { props: { strokeStyle: "#2e8b6f", lineWidth: 1.2 }, dash: [5, 4] });
      curve(lower, { props: { strokeStyle: "#2e8b6f", lineWidth: 1.2 }, dash: [5, 4] });
      label("y = x²", sx(0.24), sy(upper(0.24)) - 8, "#2e8b6f");
      label("y = -x²", sx(0.24), sy(lower(0.24)) + 14, "#2e8b6f");
      // the function (the "filling")
      curve(f, { props: { strokeStyle: "#c0392b", lineWidth: 2 } });
      // probe
      if (probeX !== null) {
        const px = sx(probeX), y = f(probeX), py = sy(y);
        ctx.save(); ctx.strokeStyle = "rgba(192,57,43,.55)"; ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(px, PAD.t); ctx.lineTo(px, H - PAD.b); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        document.getElementById("rx").textContent = probeX.toFixed(3);
        document.getElementById("ry").textContent = y.toFixed(3);
      }
    }

    function onPointer(e) {
      const r = canvas.getBoundingClientRect();
      probeX = Math.max(X_MIN, Math.min(X_MAX, ux(e.clientX - r.left)));
      draw();
    }
    canvas.addEventListener("pointermove", onPointer);
    canvas.addEventListener("pointerdown", onPointer);
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
