<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socratic Whiteboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    window.mermaid = mermaid;
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot" id="connDot"></span> Socratic<b>Whiteboard</b></div>
    <select id="courseSelect" class="course-select" title="选择课程"></select>
    <span class="pill" id="capsPill">…</span>
    <div class="spacer"></div>
    <div class="nav">
      <button class="icon" id="prevSessionBtn" title="上一节">‹</button>
      <span id="sessionCounter" class="counter">0 / 0</span>
      <button class="icon" id="nextSessionBtn" title="下一节">›</button>
    </div>
    <button class="pill btn" id="speedBtn" title="语速">1x</button>
    <button class="pill btn primary" id="openGenerate">＋ 从讲义生成课程</button>
  </header>

  <div class="workspace">
    <main class="viewport" id="whiteboardViewport">
      <div class="canvas" id="whiteboardCanvas"></div>
    </main>

    <aside class="sidebar">
      <div class="tabs">
        <button class="tab active" id="tab-transcript">对话</button>
        <button class="tab" id="tab-outline">大纲</button>
        <button class="tab" id="tab-inspector">协议</button>
      </div>
      <div class="sidebar-content" id="sidebarContent"></div>
    </aside>

    <div class="dock">
      <div class="dock-row">
        <button class="play" id="playPauseBtn" title="播放 / 暂停（空格）"><span id="playIcon">❚❚</span></button>
        <div class="subtitle">
          <div class="session-title" id="sessionTitle"></div>
          <div class="subtitle-text"><span id="subtitleText"></span><span class="cursor" id="typingCursor"></span></div>
        </div>
        <span class="state" id="stateBadge" data-state="idle">空闲</span>
        <button class="pill btn interject" id="interjectBtn">✋ 打断提问</button>
      </div>
      <div class="interject-box" id="interjectBox">
        <input id="interjectInput" placeholder="讲到这里有什么疑问？回车发送，Esc 取消">
        <button class="pill btn primary" id="interjectSend">发送</button>
        <button class="pill btn" id="interjectCancel">取消</button>
      </div>
      <div class="ask-row" id="askRow"></div>
      <button class="chip next" id="nextSessionHint" style="display:none"></button>
    </div>
  </div>

  <div class="modal" id="generateModal">
    <div class="modal-box">
      <div class="modal-head"><h3>从讲义生成白板课</h3><button class="icon" id="closeGenerate">×</button></div>
      <label>课程标题（可选）<input id="genTitle" placeholder="留空则取讲义一级标题"></label>
      <label>生成模式
        <select id="genMode">
          <option value="auto">自动（有模型用模型，否则逐段讲读）</option>
          <option value="llm">大模型苏格拉底课（需要服务端配置 API Key）</option>
          <option value="heuristic">逐段讲读（不用模型，忠实原文）</option>
        </select>
      </label>
      <label>讲义内容（Markdown / LaTeX）<textarea id="genContent" rows="10" placeholder="# 标题&#10;## 第一节 …"></textarea></label>
      <div class="modal-actions">
        <button class="pill btn" id="loadExample">载入示例讲义</button>
        <div class="spacer"></div>
        <button class="pill btn primary" id="generateBtn">开始生成</button>
      </div>
      <pre class="gen-log" id="genLog"></pre>
    </div>
  </div>

  <div id="toasts"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
