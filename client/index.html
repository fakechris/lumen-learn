<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socratic Whiteboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.7.0/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    window.mermaid = mermaid;
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <span class="dot" id="connDot" title="连接状态"></span>
    <select id="courseSelect" class="course-select" title="选择课程"></select>
    <span class="pill title-pill" id="sessionTitle"></span>
    <div class="spacer"></div>
    <div class="pill group">
      <button class="icon" id="prevSessionBtn" title="上一节">‹</button>
      <span id="sessionCounter" class="counter">0 / 0</span>
      <button class="icon" id="nextSessionBtn" title="下一节">›</button>
    </div>
    <button class="pill btn" id="speedBtn" title="语速">沉稳 · 1×</button>
    <span class="pill" id="capsPill" title="服务端能力">…</span>
    <button class="pill btn primary" id="openGenerate">＋ 从讲义生成</button>
    <button class="pill btn" id="toggleSidebar" title="对话 / 大纲">💬</button>
  </header>

  <div class="workspace">
    <main class="viewport" id="whiteboardViewport">
      <div class="canvas" id="whiteboardCanvas"></div>
    </main>
    <aside class="keypoints" id="keypoints"></aside>

    <aside class="sidebar" id="sidebar">
      <div class="tabs">
        <button class="tab active" id="tab-transcript">对话</button>
        <button class="tab" id="tab-outline">大纲</button>
        <button class="tab" id="tab-inspector">协议</button>
      </div>
      <div class="sidebar-content" id="sidebarContent"></div>
    </aside>

    <div class="dock">
      <div class="subtitle-text"><span id="subtitleText"></span><span class="cursor" id="typingCursor"></span></div>
      <div class="interject-box" id="interjectBox">
        <input id="interjectInput" placeholder="讲到这里有什么疑问？回车发送，Esc 取消">
        <button class="pill btn primary" id="interjectSend">发送</button>
        <button class="pill btn" id="interjectCancel">取消</button>
      </div>
      <div class="ask-row" id="askRow"></div>
      <div class="ask-row" style="display:flex">
        <button class="chip next" id="exerciseHint" style="display:none"></button>
        <button class="chip next" id="nextSessionHint" style="display:none"></button>
      </div>
    </div>

    <div class="controls">
      <button class="round" id="playPauseBtn" title="播放 / 暂停（空格）"><span id="playIcon">❚❚</span></button>
      <button class="round interject" id="interjectBtn" title="打断提问">✋</button>
      <span class="state" id="stateBadge" data-state="idle">空闲</span>
    </div>
  </div>

  <div class="modal" id="generateModal">
    <div class="modal-box wide">
      <div class="modal-head"><h3>从教材生成白板课</h3><button class="icon" id="closeGenerate">×</button></div>
      <div class="steps"><span class="step active" id="stepImport">1 导入讲义</span><span class="step" id="stepPlan">2 审核教案</span><span class="step" id="stepBuild">3 生成课程</span></div>

      <section id="panelImport">
        <div class="row2">
          <label>上传 PDF / Markdown<input type="file" id="genFile" accept=".pdf,.md,.txt,.markdown"></label>
          <label>课程标题（可选）<input id="genTitle" placeholder="留空则取教材标题"></label>
        </div>
        <label>或直接粘贴讲义（Markdown / LaTeX）<textarea id="genContent" rows="6" placeholder="# 标题&#10;## 第一节 …"></textarea></label>
        <div class="row2">
          <label>生成模式
            <select id="genMode">
              <option value="auto">自动（有模型用模型，否则逐段讲读）</option>
              <option value="llm">大模型苏格拉底课（需要服务端配置 API Key）</option>
              <option value="heuristic">逐段讲读（不用模型，忠实原文）</option>
            </select>
          </label>
          <div class="modal-actions" style="align-self:flex-end">
            <button class="pill btn" id="loadExample">载入示例讲义</button>
            <button class="pill btn primary" id="ingestBtn">解析并生成教案</button>
          </div>
        </div>
        <div class="doc-summary" id="docSummary"></div>
      </section>

      <section id="panelPlan" style="display:none">
        <p class="hint">教案是生成的蓝图：每节课拆成几段，每段决定用板书、示意图、探针图、3D 还是教材原图。可以在这里改媒介、改是否提问，再生成。</p>
        <div class="plan-tree" id="planTree"></div>
        <div class="modal-actions">
          <button class="pill btn" id="backToImport">← 重新导入</button>
          <div class="spacer"></div>
          <button class="pill btn primary" id="buildBtn">确认教案，生成课程</button>
        </div>
      </section>

      <pre class="gen-log" id="genLog"></pre>
    </div>
  </div>

  <div class="exercise-view" id="exerciseView">
    <div class="ex-top">
      <span class="pill" id="exKind">填空题</span>
      <span class="counter" id="exCounter">1 / 4</span>
      <div class="spacer"></div>
      <button class="icon" id="exClose" title="关闭">×</button>
    </div>
    <div class="ex-body">
      <div class="ex-main">
        <div class="ex-stem" id="exStem"></div>
        <button class="pill btn" id="exRead">▶ 朗读</button>
        <div class="ex-widget" id="exWidget"></div>
        <div class="ex-options" id="exOptions"></div>
      </div>
      <aside class="ex-side" id="exVerdict"></aside>
    </div>
    <div class="ex-nav">
      <button class="icon big" id="exPrev" title="上一题">←</button>
      <button class="chip big" id="exCheck">检查</button>
      <button class="chip big primary" id="exNext" style="display:none">下一题</button>
    </div>
  </div>

  <div id="toasts"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
